name: CI

# Every push and pull request runs the whole correctness story:
#   python  every Python self-check and the 450+ endpoint checks
#   rust    cargo test, then the Python-vs-Rust differential test on 20,000
#           ops, on Linux and on Windows (where the project is developed)
#   pyo3    builds the Rust engine as a Python extension, proves it matches
#           the Python engine event for event, then reruns the entire backend
#           test suite with the Rust book underneath it
# Benchmarks run only on pushes to main (and by hand), and their numbers are
# uploaded as artifacts rather than asserted: CI runners are shared machines,
# so a timing threshold would fail at random.

on:
  push:
    branches-ignore: [data]   # the data branch holds recording results, not code
  pull_request:
  workflow_dispatch:

env:
  # Tests use deterministic synthetic prices instead of downloading from
  # Yahoo, which is slow and rate-limits shared runners. See backend/data.py.
  BULLPEN_OFFLINE: "1"
  CARGO_TERM_COLOR: always

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Engine self-checks
        working-directory: engine
        run: python test.py
      - name: Backend endpoint checks
        run: python backend/test_bullpen.py
      - name: Backend module self-checks
        run: |
          for m in fills market_sim exec_sim stylized forecast book_backtest portfolio agent; do
            echo "== backend.$m"
            python -m backend.$m
          done

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine/rust
            engine/rust/bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: cargo test
        working-directory: engine/rust
        run: cargo test
      - name: cargo build --release
        working-directory: engine/rust
        run: cargo build --release
      - name: Differential test (Python oracle vs Rust, 20,000 ops)
        working-directory: engine
        run: python diff_test.py check ops.txt 20000
      - name: Criterion benches compile
        if: runner.os == 'Linux'        # one OS is enough to know it builds
        working-directory: engine/rust/bench
        run: cargo bench --no-run

  cpp:
    # The third implementation. Linux: strict warnings, the selftest, an
    # AddressSanitizer + UBSan build replaying 200,000 ops, and the
    # differential test against the Python oracle. Windows: MSVC, the
    # compiler most likely to disagree with g++, then the same diff test.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build, selftest, sanitizers (g++)
        if: runner.os == 'Linux'
        working-directory: engine/cpp
        run: |
          make
          make test
          make debug
          python ../diff_test.py gen /tmp/big.txt 200000
          ./bullpen_cpp_debug selftest
          ./bullpen_cpp_debug replay /tmp/big.txt > /dev/null
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build (MSVC)
        if: runner.os == 'Windows'
        working-directory: engine/cpp
        run: |
          cl /nologo /std:c++17 /O2 /EHsc /W4 /WX /Fe:bullpen_cpp.exe main.cpp
          .\bullpen_cpp.exe selftest
      - name: Differential test (Python oracle vs C++, 20,000 ops)
        working-directory: engine
        run: python diff_test.py check ops.txt 20000

  pyo3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Build the Rust engine as a Python extension
        working-directory: engine/rust
        run: |
          maturin build --release --out dist
          pip install dist/*.whl
      - name: Python vs Rust through PyO3 (fails if the extension is missing)
        env:
          BULLPEN_REQUIRE_RUST: "1"
        run: python engine/test_pyo3.py
      - name: The app now runs on the Rust engine
        run: python -c "from engine.fastbook import ENGINE; assert ENGINE == 'rust', ENGINE; print('engine:', ENGINE)"
      - name: Engine self-checks with Rust present (fastbook demo runs on the binding)
        working-directory: engine
        env:
          BULLPEN_REQUIRE_RUST: "1"
        run: python test.py
      - name: Whole backend suite on the Rust book
        run: |
          python backend/test_bullpen.py
          python -m backend.market_sim
          python -m backend.exec_sim
          python -m backend.book_backtest

  bench:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine/rust
            engine/rust/bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Shared op file, so both engines do identical work
        working-directory: engine
        run: python diff_test.py gen ops.txt 200000
      - name: Python benchmark (5 repeats, median and spread)
        working-directory: engine
        run: python bench.py --repeats 5 --ops-file ops.txt --json ../bench-python.json
      - name: Rust benchmark and lock-free pipeline
        working-directory: engine/rust
        shell: bash          # explicit bash adds -o pipefail: `cmd | tee` fails if cmd fails
        run: |
          cargo build --release
          ./target/release/bullpen_engine bench ../ops.txt | tee ../../bench-rust.txt
          ./target/release/bullpen_engine pipeline ../ops.txt | tee -a ../../bench-rust.txt
      - name: C++ benchmark on the same op file
        working-directory: engine/cpp
        shell: bash
        run: |
          make
          ./bullpen_cpp bench ../ops.txt | tee -a ../../bench-rust.txt
      - name: Criterion
        working-directory: engine/rust/bench
        shell: bash
        run: cargo bench | tee ../../../bench-criterion.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            bench-python.json
            bench-rust.txt
            bench-criterion.txt
